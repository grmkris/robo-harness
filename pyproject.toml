[project]
name = "robo-harness"
version = "0.1.0"
description = "LeRobot hardware owner and Rerun telemetry for Robo Harness"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
  "rerun-sdk==0.30.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyright>=1.1.400,<2"]
hardware = [
  "lerobot==0.6.0",
  "opencv-python-headless>=4.10",
  "feetech-servo-sdk",
]
perception = ["torch>=2.7", "transformers>=4.57", "accelerate>=1"]

[project.scripts]
robo-io = "robo_harness.service:main"
robo-rerun = "robo_harness.telemetry:main"
robo-perception = "robo_harness.perception:main"
robo-export = "robo_harness.dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/robo_harness"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "RUF",
  "PTH",
  "LOG",
  "G",
  "T20",
  "PL",
]
ignore = ["PLR0913", "PLR0912", "PLR0915", "E501"]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["PLR2004", "T20"]
"scripts/*.py" = ["T20"]
"examples/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
